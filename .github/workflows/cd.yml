name: Daily Crawl

on:
  workflow_dispatch:
    inputs:
      crawl_date:
        description: "Target date in YYYY-MM-DD. Leave empty to use today's UTC+08:00 date."
        required: false
        type: string
  schedule:
    - cron: "30 1 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare output directory
        run: mkdir -p outputs

      - name: Run scraper
        env:
          CRAWL_DATE: ${{ inputs.crawl_date }}
        run: |
          if [ -n "$CRAWL_DATE" ]; then
            python run_sina_latest_comments.py --date "$CRAWL_DATE" --max-pages 2 --roll-page-size 50 --comment-page-size 20 --max-comment-pages 2 --output outputs/sina_latest_comments.csv --format csv
          else
            python run_sina_latest_comments.py --max-pages 2 --roll-page-size 50 --comment-page-size 20 --max-comment-pages 2 --output outputs/sina_latest_comments.csv --format csv
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sina-latest-comments-csv
          path: outputs/sina_latest_comments.csv
          if-no-files-found: error
